#:schema https://developers.openai.com/codex/config-schema.json

# SeuCompiler — project-local Codex configuration
# Keep this file focused on features Codex actually reads:
# - project runtime settings
# - MCP servers
# - multi-agent role registration

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"
persistent_instructions = "Follow project AGENTS.md and .codex/AGENTS.md. Use project-local skills only if this repo actually provides them."

[features]
multi_agent = true

[profiles.strict]
approval_policy = "on-request"
sandbox_mode = "read-only"
web_search = "cached"

[profiles.yolo]
approval_policy = "never"
sandbox_mode = "workspace-write"
web_search = "live"

[agents]
max_threads = 6
max_depth = 1

[agents.explorer]
description = "Read-only codebase explorer for gathering evidence before changes are proposed."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "PR reviewer focused on correctness, security, and missing tests."
config_file = "agents/reviewer.toml"

[agents.docs_researcher]
description = "Documentation specialist that verifies APIs, framework behavior, and release notes."
config_file = "agents/docs-researcher.toml"

[agents.planner]
description = "Task planning specialist for phased implementation and risk analysis."
config_file = "agents/planner.toml"

[agents.architect]
description = "Software architecture specialist for system design, scalability, and technical decision-making."
config_file = "agents/architect.toml"

[agents.tdd_guide]
description = "Test-driven development specialist enforcing tests-first workflow."
config_file = "agents/tdd-guide.toml"

[agents.code_reviewer]
description = "Code review specialist for correctness, maintainability, and regressions."
config_file = "agents/code-reviewer.toml"

[agents.security_reviewer]
description = "Security review specialist for secrets, injection, auth, and unsafe patterns."
config_file = "agents/security-reviewer.toml"

[agents.refactor_cleaner]
description = "Dead code cleanup and safe refactoring specialist."
config_file = "agents/refactor-cleaner.toml"

[agents.build_error_resolver]
description = "Build and type error resolution specialist."
config_file = "agents/build-error-resolver.toml"

[agents.loop_operator]
description = "Autonomous loop execution specialist for controlled multi-agent workflows."
config_file = "agents/loop-operator.toml"

[agents.harness_optimizer]
description = "Codex configuration and harness optimization specialist."
config_file = "agents/harness-optimizer.toml"


approval_policy = "on-request"

# 允许无需审批的命令
allowed_commands = [
  "git add",
  "git commit",
  "git push",
  "git pull",
  "git status"
]